name: Deploy Modal backend
on:
  workflow_dispatch:
    inputs:
      import_release:
        description: Import the uploaded release into the configured dedicated Aura database
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: modal-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      MODAL_ENVIRONMENT: main
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-modal.txt
      - if: ${{ inputs.import_release }}
        run: python -m modal run modal_app.py
      - run: python -m modal deploy modal_app.py
